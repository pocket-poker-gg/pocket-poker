<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pocket Poker</title>
<meta name="description" content="No-limit hold'em with friends. No accounts, no installs.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Poker">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app">

  <section id="home" class="view">
    <div class="home-inner">
      <div class="brand">
        <div class="brand-mark">&#9824;</div>
        <h1>Pocket Poker</h1>
        <p class="tagline">No-limit hold&rsquo;em with friends.<br>No accounts. No installs. Play money.</p>
      </div>
      <div class="panel">
        <input id="nameInput" class="text-input" maxlength="16" autocomplete="off" autocorrect="off" placeholder="Your name" enterkeyhint="go">
        <button id="createBtn" class="btn primary big">Create a table</button>
        <div class="divider"><span>or join with a code</span></div>
        <form id="joinForm" class="join-row">
          <input id="codeInput" class="text-input code" maxlength="4" placeholder="ABCD" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false">
          <button class="btn" type="submit">Join</button>
        </form>
      </div>
      <p class="fineprint">Play money only &middot; just for fun</p>
    </div>
  </section>

  <section id="table" class="view hidden">
    <header class="topbar">
      <button id="codeChip" class="chip" title="Invite friends">
        <span id="codeLabel">----</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="m7 8 5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
      </button>
      <div id="potChip" class="chip pot hidden">
        <span class="pot-coin"></span>
        <b id="potVal">0</b>
      </div>
      <button id="menuBtn" class="chip icon-only" title="Menu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </header>

    <div id="felt">
      <div class="felt-sheen"></div>
      <div id="streetLabel" class="street-label hidden"></div>
      <div id="community" class="community"></div>
      <div id="seats"></div>
    </div>

    <div id="meArea">
      <div id="myCards" class="mycards"></div>
      <div id="meInfo" class="me-info hidden"><span id="meName"></span><span id="meStack" class="stack-pill"></span></div>
      <div id="actionBar" class="actions hidden">
        <button id="foldBtn" class="btn danger">Fold</button>
        <button id="callBtn" class="btn neutral">Check</button>
        <button id="raiseBtn" class="btn gold">Bet</button>
      </div>
      <div id="raiseSheet" class="raise-sheet hidden">
        <div class="raise-head">
          <span id="raiseVal">0</span>
          <button id="raiseClose" class="chip icon-only"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <input type="range" id="raiseRange" min="0" max="100" value="0">
        <div class="quick-row">
          <button class="chip qbtn" data-q="min">Min</button>
          <button class="chip qbtn" data-q="pot">Pot</button>
          <button class="chip qbtn" data-q="allin">All in</button>
          <button id="raiseConfirm" class="btn gold">Raise</button>
        </div>
      </div>
    </div>

    <div id="lobby" class="overlay">
      <div class="sheet">
        <h2 id="lobbyTitle">Lobby</h2>
        <p class="lobby-sub">Share the code - friends tap the link and they&rsquo;re in.</p>
        <button id="shareBtn" class="share-code"><span id="shareCode">----</span><span class="share-hint">tap to invite</span></button>
        <ul id="lobbyPlayers" class="lobby-players"></ul>
        <button id="addBotBtn" class="btn ghost hidden">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Add a bot
        </button>
        <div id="hostSettings" class="host-settings hidden">
          <div class="setting"><label>Blinds</label>
            <div class="seg" id="blindsSeg">
              <button data-b="1/2">1/2</button><button data-b="5/10" class="on">5/10</button><button data-b="25/50">25/50</button>
            </div>
          </div>
          <div class="setting"><label>Stack</label>
            <div class="seg" id="stackSeg">
              <button data-s="500">500</button><button data-s="1000" class="on">1,000</button><button data-s="5000">5,000</button>
            </div>
          </div>
        </div>
        <button id="startBtn" class="btn primary big hidden">Deal the first hand</button>
        <p id="lobbyHint" class="fineprint"></p>
      </div>
    </div>

    <div id="betweenBar" class="between-bar hidden">
      <div id="resultText" class="result-text"></div>
      <button id="nextHandBtn" class="btn primary hidden">Next hand</button>
      <button id="rebuyBtn" class="btn hidden">Rebuy</button>
    </div>

    <div id="menuSheet" class="overlay hidden">
      <div class="sheet">
        <h2>Table</h2>
        <button id="menuShare" class="menu-item">Invite friends</button>
        <button id="menuRebuy" class="menu-item hidden">Rebuy to full stack</button>
        <button id="menuRestart" class="menu-item hidden">Restart game (reset stacks)</button>
        <button id="menuLeave" class="menu-item warn">Leave table</button>
        <button id="menuClose" class="btn">Close</button>
      </div>
    </div>

    <div id="connOverlay" class="overlay dark hidden">
      <div class="conn-box"><div class="spinner"></div><p>Reconnecting&hellip;</p></div>
    </div>

    <div id="toasts"></div>
  </section>
</div>
<script src="/app.js"></script>
</body>
</html>
