name = "pocket-poker"
main = "src/worker.js"
compatibility_date = "2026-09-09"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "PokerRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PokerRoom"]

[vars]
PUBLIC_ORIGIN = "https://pocket-poker.pocket-poker-gg.workers.dev"
